name: 202608301447 Self-test and lock
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every antibody fires on disease and is silent on health
        run: node tools/selftest.mjs
      - name: Registry inoculates itself
        run: node inoculate.mjs .
