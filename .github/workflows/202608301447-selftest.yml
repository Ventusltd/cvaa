name: 202608301447 Self-test and full-history fleet audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Prove full history, registry and JSON contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse --is-shallow-repository)" = false
          test "$(git rev-list --count HEAD)" -gt 1
          test "$(find vaccines -maxdepth 1 -type f -name '*.md' | wc -l)" -eq "$(node -e "console.log(Object.keys(require('./vaccines.lock')).length)")"
          node tools/selftest.mjs | tee /tmp/selftest.log
          test "$(tail -n 1 /tmp/selftest.log)" = 'all antibodies fire on disease and stay silent on health'
          node inoculate.mjs . --no-write | tee /tmp/inoculate.log
          test "$(tail -n 1 /tmp/inoculate.log)" = 'repo is immune to all vaccines on file'
          node inoculate.mjs . --no-write --json > /tmp/run.jsonl
          node - <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('/tmp/run.jsonl','utf8').split('\n').filter(l => l.startsWith('{"schema":"cvaa.run.v1"'));
          if (lines.length !== 1) throw new Error(`expected one JSON record, got ${lines.length}`);
          const run = JSON.parse(lines[0]);
          if (run.status !== 'immune') throw new Error(`registry state is ${run.status}`);
          if (run.shallow !== false || run.context?.commit_count < 2) throw new Error('history context is incomplete');
          const active = fs.readdirSync('vaccines').filter(f => f.endsWith('.md'))
            .filter(f => !/^superseded_by:/m.test(fs.readFileSync(`vaccines/${f}`, 'utf8'))).length;
          if (run.results.length !== active) throw new Error(`expected ${active} active results (vaccines on file minus superseded), got ${run.results.length}`);
          NODE

  fleet-audit:
    needs: selftest
    if: ${{ always() && needs.selftest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: cvaa
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Ventusltd/gridatlas
          path: repos/gridatlas
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Ventusltd/pipelinenews
          path: repos/pipelinenews
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Run current three-repository fleet table
        shell: bash
        run: |
          set -euo pipefail
          node cvaa/tools/fleet.mjs cvaa repos/gridatlas repos/pipelinenews --json-out fleet.json | tee fleet.txt
          node - <<'NODE'
          const fleet = require('./fleet.json');
          const names = fleet.repositories.map(r => r.name);
          if (fleet.schema !== 'cvaa.fleet.v1') throw new Error('wrong fleet schema');
          for (const required of ['cvaa', 'gridatlas', 'pipelinenews']) {
            if (!names.includes(required)) throw new Error(`missing repository: ${required}; found ${names}`);
          }
          if (fleet.repositories.some(r => r.shallow)) throw new Error('fleet contains a shallow checkout');
          NODE
          {
            echo '## CVAA fleet audit'
            echo
            echo '```text'
            cat fleet.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
