name: Prepare and prove grid-first vaccine candidate
on:
  push:
    branches: ['test/grid-first-vaccine-202609132340']
    paths: ['.github/workflows/cvaa-vaccine-build-202609132340.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: test/grid-first-vaccine-202609132340
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Apply only registry integration and preserve the historical note
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'test/grid-first-vaccine-202609132340'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git hash-object tools/selftest.mjs)" = '96fec3acf500fcb6c75d10db4c385b2c52774055'
          test "$(git hash-object vaccines/20260907-runner-vaccines.md)" = 'a89fa5ba5e7333b3b52d9872942f8310358a2856'
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/selftest.mjs'); s=p.read_text()
          a='const DISEASED = {\n'
          b='let failed = 0;\n'
          assert s.count(a)==1 and s.count(b)==1
          s=s.replace(a,a+"  'grid-first-critical-path': r => w(r, '.cvaa/contracts/grid-first-critical-path.json', '{}'),\n")
          s=s.replace(b,"execSync(`node ${join(here, 'tools', 'grid-first-critical-path.test.mjs')}`, { stdio: 'inherit' });\n"+b)
          p.write_text(s)
          Path('vaccines/20260907-runner-vaccines.md').rename('studies/20260907-runner-vaccines.md')
          Path('.github/workflows/cvaa-vaccine-build-202609132340.yml').unlink()
          PY
          test "$(git hash-object studies/20260907-runner-vaccines.md)" = 'a89fa5ba5e7333b3b52d9872942f8310358a2856'
          node inoculate.mjs --lock
      - name: Prove antibodies and registry through the existing runner
        shell: bash
        run: |
          set -euo pipefail
          node tools/selftest.mjs | tee /tmp/grid-first-selftest.log
          test "$(tail -n 1 /tmp/grid-first-selftest.log)" = 'all antibodies fire on disease and stay silent on health'
          node inoculate.mjs . --no-write | tee /tmp/grid-first-inoculate.log
          test "$(tail -n 1 /tmp/grid-first-inoculate.log)" = 'repo is immune to all vaccines on file'
          node inoculate.mjs . --no-write --json > /tmp/grid-first-registry.jsonl
      - name: Commit validated files to candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin test/grid-first-vaccine-202609132340
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import subprocess
          allowed={'tools/selftest.mjs','vaccines.lock','vaccines/20260907-runner-vaccines.md','studies/20260907-runner-vaccines.md','.github/workflows/cvaa-vaccine-build-202609132340.yml'}
          changed=set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          changed.update(subprocess.check_output(['git','ls-files','--others','--exclude-standard']).decode().splitlines())
          assert changed == allowed, (changed,allowed)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tools/selftest.mjs vaccines.lock vaccines/20260907-runner-vaccines.md studies/20260907-runner-vaccines.md .github/workflows/cvaa-vaccine-build-202609132340.yml
          git commit -m 'vaccine: lock grid-first guard, integrate tested fixtures, preserve prose outside executable registry'
          git push origin HEAD:refs/heads/test/grid-first-vaccine-202609132340
          git log -1 --format=%H
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: grid-first-vaccine-proof
          path: /tmp/grid-first-*
          retention-days: 14
          if-no-files-found: warn
